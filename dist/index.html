<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
<script defer src="main.js"></script></head>
<body>
    <div id="carousel">
        <div id="carousel_area">
            <div id="image_holder">
                <div id="images">
                    <img id="fake2"src="6bc359fbe0b2349f7ce3.jpg">
                    <img id="img0" src="7ecec994f53b69846899.jpg" alt="The number zero.">
                    <img id="img1" src="c9690ffd72256d6c0f83.jpg" alt="The number one.">
                    <img id="img2" src="6bc359fbe0b2349f7ce3.jpg" alt="The number two.">
                    <img id="fake0" src="7ecec994f53b69846899.jpg">
                </div>
            </div>    
            <div id="images_frame_border">
                <div id="images_frame"></div>
            </div>
        </div>
        <div id="buttons_area">
            <div id="buttons">
                <button id="prev_butt">Prev</button>
                <button id="next_butt">Next</button>
            </div>
        </div>
        <div id="dots_area">
             <ul id="dots">
                <li id="dot0" class="dot dot_active"></li>
                <li id="dot1" class="dot"></li>
                <li id="dot2" class="dot"></li>
             </ul>
        </div>
    </div>
</body>
</html>
